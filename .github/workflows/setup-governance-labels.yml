name: "🏷️ Setup DAO Governance Labels"

on:
  workflow_dispatch:

permissions:
  issues: write
  repository-projects: write

jobs:
  sync-labels:
    name: Create & Sync Standardized DAO Labels
    runs-on: ubuntu-latest
    steps:
      - name: Provision Official Had-e-Tasar v2 Labels
        uses: actions/github-script@v8
        with:
          script: |
            const labels = [
              { name: "governance: charter-v2", color: "7057ff", description: "Executive charters and foundational DAO governance laws" },
              { name: "engine: had-e-tasar", color: "008672", description: "Powered by Had-e-Tasar Impact Limit algorithm v2" },
              { name: "tokenomics: PSC", color: "f59e0b", description: "Linked to PSC Exponential Decay Treasury & 50% Advisors Pool" },
              { name: "security: anti-collusion", color: "d93f0b", description: "Protected by 3-Layer Anti-Collusion AI & ZKP Whistleblower shield" },
              { name: "status: pending-consensus", color: "fbca04", description: "Newly submitted decision awaiting AI Guardrail & initial lock" },
              { name: "status: active-voting", color: "1d76db", description: "100% creator impact staked; voting live on MetaRang, Telegram & Bale" },
              { name: "status: approved-delegated", color: "0e8a16", description: "Approved (>=1 unit margin); converted to Issue in target repository" },
              { name: "status: rejected-penalized", color: "b60205", description: "Rejected or failed quorum; progressive lock penalty applied to creator" },
              { name: "violation: tier-authority", color: "e99695", description: "Blocked: Target decision tier exceeds creator intrinsic role tier" },
              { name: "rfc: upward-escalation", color: "5319e7", description: "Open research topic for upward tier escalation mechanics" }
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
                console.log(`Created label: ${label.name}`);
              } catch (error) {
                if (error.status === 422) {
                  await github.rest.issues.updateLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description
                  });
                  console.log(`Updated existing label: ${label.name}`);
                } else {
                  console.error(`Failed on label ${label.name}:`, error);
                }
              }
            }
