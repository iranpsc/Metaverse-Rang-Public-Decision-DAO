name: "🏛️ DAO Public Decision Lifecycle & Auto-Delegation"

on:
  discussion:
    types: [created, labeled]
  repository_dispatch:
    types: [dao-decision-evaluated]

permissions:
  discussions: write
  issues: write
  contents: read

jobs:
  # ============================================================================
  # JOB 1: Validate New Decision Creation & Initialize Staking Receipt
  # ============================================================================
  validate-and-initialize:
    name: "Stage 1 & 2: Vertical Tier Guardrail & Voting Initialization"
    if: github.event_name == 'discussion' && github.event.action == 'created'
    runs-on: ubuntu-latest
    steps:
      - name: Parse Discussion Form & Enforce Vertical Authority Rule
        uses: actions/github-script@v7
        with:
          script: |
            const discussion = context.payload.discussion;
            const body = discussion.body || "";

            // Tier configuration table based on Had-e-Tasar Charter v2
            const TIERS = {
              1:  { name: "Citizen (شهروند)", impact: 1, quorum: 100, hours: 24 },
              2:  { name: "Reporter (خبرنگار)", impact: 3, quorum: 300, hours: 36 },
              3:  { name: "Contributor (مشارکت‌کننده)", impact: 8, quorum: 800, hours: 48 },
              4:  { name: "Developer (توسعه‌دهنده)", impact: 18, quorum: 1800, hours: 72 },
              5:  { name: "Inspector (بازرس)", impact: 36, quorum: 3600, hours: 96 },
              6:  { name: "Merchant (تاجر)", impact: 76, quorum: 7600, hours: 120 },
              7:  { name: "Advocate (دادخواه)", impact: 166, quorum: 16600, hours: 144 },
              8:  { name: "City Council (شورای شهر)", impact: 366, quorum: 36600, hours: 168 },
              9:  { name: "Mayor (شهردار)", impact: 796, quorum: 79600, hours: 192 },
              10: { name: "Governor (فرماندار)", impact: 1696, quorum: 169600, hours: 216 },
              11: { name: "Commissioner (کارگزار)", impact: 3696, quorum: 369600, hours: 240 },
              12: { name: "Arbitrator (داور)", impact: 7896, quorum: 789600, hours: 288 },
              13: { name: "Legislator (دادگذار)", impact: 16369, quorum: 1636900, hours: 336 }
            };

            // Extract fields from GitHub Discussion Form markdown
            const citizenIdMatch = body.match(/### 1\. Creator Citizen ID.*\s+([^\n#]+)/i);
            const creatorTierMatch = body.match(/### 2\. Creator Intrinsic Governance Tier.*\s+Tier (\d+):/i);
            const targetTierMatch = body.match(/### 3\. Target Decision Governance Tier.*\s+Tier (\d+):/i);
            const targetRepoMatch = body.match(/### 4\. Target Execution Repository.*\s+(iranpsc\/[a-zA-Z0-9_-]+)/i);

            if (!creatorTierMatch || !targetTierMatch) {
              console.log("Not a structured Public Decision form. Skipping automated guardrail.");
              return;
            }

            const citizenId = citizenIdMatch ? citizenIdMatch[1].trim() : "Unverified";
            const creatorLevel = parseInt(creatorTierMatch[1], 10);
            const targetLevel = parseInt(targetTierMatch[1], 10);
            const targetRepo = targetRepoMatch ? targetRepoMatch[1].trim() : "iranpsc/Metaverse-Rang-Public-Decision-DAO";

            const creatorConfig = TIERS[creatorLevel];
            const targetConfig = TIERS[targetLevel];

            // Enforce Vertical Authority Rule: Creator cannot enact decisions for higher tiers
            if (targetLevel > creatorLevel) {
              const rejectionComment = `## 🚫 AI & Protocol Guardrail Alert: Vertical Authority Violation
              
              Greetings Citizen **\`${citizenId}\`** (@${discussion.user.login}),
              
              According to **Article 1 of the Had-e-Tasar Executive Charter (v2.0)**, citizens may only create decisions for **their own governance tier or lower tiers**. Lower tiers cannot enact rules or decisions for higher tiers.
              
              * **Your Declared Creator Tier:** Tier ${creatorLevel} —${creatorConfig.name} (\`${creatorConfig.impact}\` Impact Units)
              * **Attempted Target Decision Tier:** Tier ${targetLevel} —${targetConfig.name} (\`${targetConfig.impact}\` Impact Units)
              
              **System Action:** This decision registration has been blocked (` + "`status: violation: tier-authority`" + `). Please submit a new proposal targeting **Tier ${creatorLevel} or below**, or escalate the topic as an RFC draft.`;

              await github.graphql(`
                mutation($discussionId: ID!,$body: String!) {
                  addDiscussionComment(input: { discussionId: $discussionId, body:$body }) {
                    comment { id }
                  }
                }
              `, { discussionId: discussion.node_id, body: rejectionComment });

              return;
            }

            // Validated: Post Official Staking & Multi-Channel Voting Receipt
            const createdAt = new Date(discussion.created_at);
            const expiresAt = new Date(createdAt.getTime() + targetConfig.hours * 3600 * 1000).toISOString();
            const decisionId = `DEC-${createdAt.getUTCFullYear()}-${String(discussion.number).padStart(4, '0')}`;

            const initializationComment = `## 🏛️ Official Public Decision Registration & Staking Receipt
            
            | Parameter | Verified Value |
            | :--- | :--- |
            | **Decision ID** | \`${decisionId}\` |
            | **Creator Citizen ID** | \`${citizenId}\` (@${discussion.user.login}) |
            | **Creator Intrinsic Tier & Locked Stake** | **Tier ${creatorLevel}:${creatorConfig.name}** (\`${creatorConfig.impact}\` Impact Units Staked — **100% Locked**) |
            | **Target Governance Tier** | **Tier ${targetLevel}:${targetConfig.name}** |
            | **Required Progressive Quorum** | **\`${targetConfig.quorum.toLocaleString()}\` Impact Units** |
            | **Voting Window Duration** | **\`${targetConfig.hours} Hours\`** *(Expires: \`${expiresAt}\`)* |
            | **Target Delegation Repository** | \`${targetRepo}\` |
            | **Creator Voting & Cancellation Rights** | 🔒 **Disabled** *(Irrevocable until expiration)* |
            | **Reward Pool Allocation** | **50% of PSC Scientific Advisors Annual Pool** *(Proportional to Net Positive Votes)* |
            
            ---
            ### 🗳️ Multi-Channel Off-Git Voting Rules
            1. **MetaRang Platform (\`metarang.com\`):** Citizens connected via SSO/Wallet may allocate a **custom partial amount** of their available Impact Limit.
            2. **Telegram & Bale Mini-Apps / Polls:** Clicking the vote button in official channels/groups **consumes 100% of your remaining Impact Limit in a single click** and sends an instant consumption notification.
            3. **Progressive Burn & Impact Decay:** Voters from tiers higher than **Tier ${targetLevel}** will have progressive anti-inflationary burn and decay multipliers applied automatically:
               $$\\Delta L = L_{\\text{voter}} - ${targetLevel}$$
            4. **Single-Unit Margin Rule:** At \`${expiresAt}\`, provided the \`${targetConfig.quorum.toLocaleString()}\` quorum is met, **even a 1-unit margin** determines whether this decision is \`APPROVED\` or \`REJECTED\`.`;

            await github.graphql(`
              mutation($discussionId: ID!,$body: String!) {
                addDiscussionComment(input: { discussionId: $discussionId, body:$body }) {
                  comment { id }
                }
              }
            `, { discussionId: discussion.node_id, body: initializationComment });

  # ============================================================================
  # JOB 2: Auto-Delegate Approved Decision to Target Repository Issue
  # ============================================================================
  auto-delegate-approved-decision:
    name: "Stage 4: Convert Approved Decision to Target Repo Issue"
    if: >
      (github.event_name == 'discussion' && github.event.action == 'labeled' && github.event.label.name == 'status: approved-delegated') ||
      (github.event_name == 'repository_dispatch' && github.event.client_payload.outcome == 'APPROVED')
    runs-on: ubuntu-latest
    steps:
      - name: Create Actionable Issue in Target Repository & Post Audit Receipt
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ORG_DELEGATION_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const isDispatch = context.eventName === 'repository_dispatch';
            const discussionNumber = isDispatch ? context.payload.client_payload.discussion_number : context.payload.discussion.number;

            // Fetch Discussion details via GraphQL
            const queryResult = await github.graphql(`
              query($owner: String!, $repo: String!,$num: Int!) {
                repository(owner: $owner, name:$repo) {
                  discussion(number: $num) {
                    id
                    number
                    title
                    body
                    url
                    author { login }
                  }
                }
              }
            `, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              num: parseInt(discussionNumber, 10)
            });

            const disc = queryResult.repository.discussion;
            const body = disc.body || "";

            const citizenIdMatch = body.match(/### 1\. Creator Citizen ID.*\s+([^\n#]+)/i);
            const targetTierMatch = body.match(/### 3\. Target Decision Governance Tier.*\s+([^\n#]+)/i);
            const targetRepoMatch = body.match(/### 4\. Target Execution Repository.*\s+(iranpsc\/[a-zA-Z0-9_-]+)/i);

            const citizenId = citizenIdMatch ? citizenIdMatch[1].trim() : "Verified-Citizen";
            const targetTierText = targetTierMatch ? targetTierMatch[1].trim() : "General Governance Tier";
            const fullTargetRepo = targetRepoMatch ? targetRepoMatch[1].trim() : `${context.repo.owner}/${context.repo.repo}`;
            const [targetOwner, targetRepoName] = fullTargetRepo.split("/");

            const decisionId = `DEC-${new Date().getUTCFullYear()}-${String(disc.number).padStart(4, '0')}`;
            const tallyData = isDispatch ? context.payload.client_payload.tally : {
              positive_votes: "Verified via Quorum",
              negative_votes: "Verified",
              net_margin: ">= +1 Unit",
              burned_impact: "Calculated on Edge",
              collusion_risk_score: "0.01 (Passed)"
            };

            const issueBody = `## 🏛️ Delegated Public Decision Task (\`${decisionId}\`)
            
            > [!IMPORTANT]
            > This actionable issue was **automatically generated and delegated** by the **MetaRang Public Decision DAO Engine (v2.0)** after passing citizen consensus and the 3-Layer Anti-Collusion Shield.
            
            ### 📊 Governance & Consensus Audit Trail
            * **Source Discussion:** ${disc.url}
            * **Creator Citizen ID:** \`${citizenId}\` (@${disc.author.login})
            * **Target Governance Tier:** ${targetTierText}
            * **Effective Positive Votes:** \`${tallyData.positive_votes}\`
            * **Effective Negative Votes:** \`${tallyData.negative_votes}\`
            * **Net Victory Margin:** \`${tallyData.net_margin}\` *(Single-Unit Margin Rule Verified)*
            * **Anti-Collusion Risk Score:** \`${tallyData.collusion_risk_score}\`
            * **Creator Stake Status:** Scheduled for 100% unlock after **24 hours**; eligible for **50% PSC Scientific Advisors Annual Pool** reward.
            * **Developer Execution Bounty:** Eligible for automated settlement via **\`Developers Wallet\` (PSC Tokenomics Phase 2)**.
            
            ---
            ### 📋 Original Approved Decision Specification
            ${body}`;

            // Create the Issue in the target repository
            let createdIssue;
            try {
              const issueResponse = await github.rest.issues.create({
                owner: targetOwner,
                repo: targetRepoName,
                title: `[DAO-APPROVED | ${decisionId}]${disc.title.replace(/^[DECISION]\s*/i, '')}`,
                body: issueBody
              });
              createdIssue = issueResponse.data;
            } catch (err) {
              console.warn(`Cross-repo issue creation in ${fullTargetRepo} fell back to DAO repo:`, err.message);
              const fallbackResponse = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[DAO-APPROVED | ${decisionId} -> ${targetRepoName}]${disc.title.replace(/^[DECISION]\s*/i, '')}`,
                body: issueBody
              });
              createdIssue = fallbackResponse.data;
            }

            // Post Delegation Receipt back on the Discussion
            const receiptComment = `## ✅ Decision Approved & Automatically Delegated!
            
            This decision has passed citizen consensus under the **Had-e-Tasar v2 Single-Unit Margin Rule** and cleared the **Anti-Collusion Shield**.
            
            * **Delegated Actionable Issue:** ${createdIssue.html_url}
            * **Target Repository:** \`${fullTargetRepo}\`
            * **Creator Stake Unlock:** Your locked Impact Limit has entered the recharge cycle and will be 100% available in **24 hours**.
            * **PSC Creator Reward:** Registered for proportional payout from **50% of the PSC Scientific Advisors Annual Allocation** based on net positive votes earned.`;

            await github.graphql(`
              mutation($discussionId: ID!,$body: String!) {
                addDiscussionComment(input: { discussionId: $discussionId, body:$body }) {
                  comment { id }
                }
              }
            `, { discussionId: disc.id, body: receiptComment });
